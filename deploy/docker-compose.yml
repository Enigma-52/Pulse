services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DEFAULT_MAX_MEMORY_USAGE: "0"
    # Hard cap on the container's cgroup memory so it can't crowd out other
    # services on a shared host. max_server_memory_usage_ratio above (in
    # config.xml) is a fraction of this. Override with CLICKHOUSE_MEM_LIMIT
    # if the droplet has more headroom to give it.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-768m}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - pulse-net
  pulse:
    build:
      context: ../pulse
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4321:4321"
    mem_limit: ${PULSE_MEM_LIMIT:-256m}
    environment:
      PULSE_ADDR: ":4321"
      PULSE_CLICKHOUSE_ADDR: clickhouse:9000
      PULSE_CLICKHOUSE_DB: default
      PULSE_CLICKHOUSE_USER: default
      PULSE_CLICKHOUSE_PASSWORD: pulse
      # Override in production: export PULSE_JWT_SECRET before docker compose up
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:-change-me-in-production}
      # Per-signal retention in days, 0 or unset = keep forever
      # PULSE_RETENTION_TRACES_DAYS: "15"
      # PULSE_RETENTION_LOGS_DAYS: "7"
      # PULSE_RETENTION_METRICS_DAYS: "30"
      # PULSE_RETENTION_EXCEPTIONS_DAYS: "30"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pulse-net

  ui:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3301:80"
    mem_limit: ${UI_MEM_LIMIT:-64m}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pulse:
        condition: service_healthy
    networks:
      - pulse-net

networks:
  pulse-net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
