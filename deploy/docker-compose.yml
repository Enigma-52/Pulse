version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DEFAULT_MAX_MEMORY_USAGE: "536870912"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - pulse-net
    deploy:
      resources:
        limits:
          memory: 768m

  pulse:
    build:
      context: ../pulse
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      PULSE_ADDR: ":4321"
      PULSE_CLICKHOUSE_ADDR: clickhouse:9000
      PULSE_CLICKHOUSE_DB: default
      PULSE_CLICKHOUSE_USER: default
      PULSE_CLICKHOUSE_PASSWORD: pulse
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pulse-net
    deploy:
      resources:
        limits:
          memory: 256m

  ui:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "3301:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pulse:
        condition: service_healthy
    networks:
      - pulse-net
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  pulse-net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
